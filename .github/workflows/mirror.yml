
name: Daily Mirror

on:
  schedule:
    # 每天北京时间 00:00（UTC 16:00）
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Mirror upstream without upstream workflows
        env:
          UPSTREAM_URL: https://github.com/lubin776/tvbox-api-backup.git
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -e

          echo "保存自己的镜像工作流..."
          mkdir -p "$RUNNER_TEMP/keep-workflow"
          cp .github/workflows/mirror.yml "$RUNNER_TEMP/keep-workflow/mirror.yml"

          echo "获取上游默认分支..."
          UPSTREAM_BRANCH=$(git ls-remote --symref "$UPSTREAM_URL" HEAD \
            | awk '$1 == "ref:" {sub("refs/heads/", "", $2); print $2}')

          if [ -z "$UPSTREAM_BRANCH" ]; then
            echo "无法获取上游默认分支"
            exit 1
          fi

          echo "上游分支: $UPSTREAM_BRANCH"
          echo "目标分支: $TARGET_BRANCH"

          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"

          echo "切换到上游最新内容..."
          git checkout -B "$TARGET_BRANCH" FETCH_HEAD

          echo "删除上游所有 GitHub Actions 工作流..."
          rm -rf .github/workflows

          echo "恢复自己编写的镜像工作流..."
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/keep-workflow/mirror.yml" \
            .github/workflows/mirror.yml

          echo "提交同步结果..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "自动镜像: 同步上游最新内容"
          else
            echo "内容没有变化，无需提交"
          fi

          echo "推送到目标仓库..."
          git push origin "HEAD:$TARGET_BRANCH" --force

          echo "镜像同步完成！"
